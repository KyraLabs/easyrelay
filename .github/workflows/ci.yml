name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format and toolchain pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the Zig version pin is consistent
        run: ./scripts/check-toolchain.sh

      - id: zig
        run: echo "version=$(tr -d '[:space:]' < .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
          cache-key: lint

      - name: Check formatting
        run: zig fmt --check --exclude zig-pkg .

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - id: zig
        run: echo "version=$(tr -d '[:space:]' < .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
          cache-key: test-${{ matrix.os }}

      - name: Build
        run: zig build

      - name: Test
        run: zig build test --summary all

  interop:
    name: Interop (nak)
    runs-on: ubuntu-latest
    env:
      NAK_VERSION: v0.20.6
    steps:
      - uses: actions/checkout@v7

      - id: zig
        run: echo "version=$(tr -d '[:space:]' < .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
          cache-key: interop

      - name: Install nak
        run: |
          curl -fsSLo "$RUNNER_TEMP/nak" \
            "https://github.com/fiatjaf/nak/releases/download/$NAK_VERSION/nak-$NAK_VERSION-linux-amd64"
          chmod +x "$RUNNER_TEMP/nak"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build
        run: zig build

      - name: Publish and read back with nak
        run: ./scripts/interop-nak.sh

      - name: No acknowledged event is lost to SIGTERM
        run: ./scripts/shutdown-durability.sh

      - name: Back up a running relay and restore it
        run: ./scripts/backup-restore.sh

  deploy:
    name: Compose behind Caddy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: zig
        run: echo "version=$(tr -d '[:space:]' < .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
          cache-key: deploy

      # Tagged as the image the compose file names, so compose uses it instead of pulling.
      - name: Build the image
        run: |
          zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe --prefix dist/linux-amd64
          docker build -t ghcr.io/kyralabs/easyrelay:latest .

      - name: Start the compose file with only RELAY_DOMAIN set
        working-directory: deploy
        env:
          RELAY_DOMAIN: localhost
        run: docker compose up -d

      - name: Reach the relay over TLS through Caddy
        run: ./scripts/check-compose.sh

      - name: Show the logs
        if: failure()
        working-directory: deploy
        env:
          RELAY_DOMAIN: localhost
        run: docker compose logs

  cross:
    name: Cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
    steps:
      - uses: actions/checkout@v7

      - id: zig
        run: echo "version=$(tr -d '[:space:]' < .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
          cache-key: cross-${{ matrix.target }}

      # Keep in sync with the targets release.yml publishes.
      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
