name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Format and toolchain pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the Zig version pin is consistent
        run: ./scripts/check-toolchain.sh

      - id: zig
        run: echo "version=$(tr -d '[:space:]' < .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
          cache-key: lint

      # zig-pkg/ is where the build system unpacks the dependencies. Excluding it
      # keeps this command identical to the one contributors run after a build.
      - name: Check formatting
        run: zig fmt --check --exclude zig-pkg .

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - id: zig
        run: echo "version=$(tr -d '[:space:]' < .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
          cache-key: test-${{ matrix.os }}

      - name: Build
        run: zig build

      - name: Test
        run: zig build test --summary all

  interop:
    name: Interop (nak)
    runs-on: ubuntu-latest
    # The version is pinned: an interop test that follows a moving client tells
    # you something changed, not which side changed it.
    env:
      NAK_VERSION: v0.20.6
    steps:
      - uses: actions/checkout@v7

      - id: zig
        run: echo "version=$(tr -d '[:space:]' < .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
          cache-key: interop

      - name: Install nak
        run: |
          curl -fsSLo "$RUNNER_TEMP/nak" \
            "https://github.com/fiatjaf/nak/releases/download/$NAK_VERSION/nak-$NAK_VERSION-linux-amd64"
          chmod +x "$RUNNER_TEMP/nak"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build
        run: zig build

      # docs/testing.md: conformance checks the relay against this project's
      # reading of NIP-01, interop checks it against what a client actually does.
      - name: Publish and read back with nak
        run: ./scripts/interop-nak.sh

  cross:
    name: Cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - x86_64-macos
          - aarch64-macos
    steps:
      - uses: actions/checkout@v7

      - id: zig
        run: echo "version=$(tr -d '[:space:]' < .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
          cache-key: cross-${{ matrix.target }}

      # Guards the exact targets release.yml publishes. Without this a broken
      # cross-compile is only discovered when a tag is pushed, which is the worst
      # possible moment to discover it.
      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
